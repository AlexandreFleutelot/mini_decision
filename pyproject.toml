[project]
name = "mini-decision"
version = "0.1.0"
description = "Mini modèle de décision booléenne calibrée (QDA-like), entraîné from scratch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "sentencepiece>=0.2",
    "torchmetrics>=1.4",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "anthropic>=2.0",
    "openai>=2.0",
    "ollama>=0.4",
]

[project.scripts]
mini-decision = "mini_decision.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_decision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
